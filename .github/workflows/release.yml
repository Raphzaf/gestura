name: Release

# Publishes a GitHub Release with the Windows build:
#  * automatically on every push to main whose pyproject.toml version has no release yet
#    (bump `version` in pyproject.toml to ship a new release), or
#  * by pushing a tag such as v0.1.1, or
#  * from GitHub: Actions > Release > Run workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.1"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"
          else v="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $v already exists; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "Will publish $v"; echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.ver.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt pyinstaller==6.22.3 && pip install -e . --no-deps
        if: steps.ver.outputs.skip != 'true'
      - name: Tests
        if: steps.ver.outputs.skip != 'true'
        run: python -m pytest -q
      - name: Build Gestura.exe
        if: steps.ver.outputs.skip != 'true'
        run: pyinstaller --noconfirm gestura.spec
      - name: Frozen app smoke test
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Gestura\Gestura.exe -ArgumentList "--config-dir","$env:RUNNER_TEMP\gcfg","--smoke-test","4" -PassThru -Wait
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -gt 1) { exit 1 }  # 1 = no webcam on the runner (expected)
      - name: Zip portable build
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: Compress-Archive -Path dist\Gestura -DestinationPath Gestura-windows-x64.zip
      - name: Build installer (Inno Setup)
        if: steps.ver.outputs.skip != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = "${{ steps.ver.outputs.version }}".TrimStart("v")
          & $iscc "/DAppVersion=$ver" installer\gestura.iss
          Copy-Item installer\Output\Gestura-Setup-*.exe .
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          name: Gestura ${{ steps.ver.outputs.version }}
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **Windows 10/11 (64-bit).** Download `Gestura-Setup-*.exe` (installer) or
            `Gestura-windows-x64.zip` (portable: unzip, then run `Gestura\Gestura.exe`).
            See the README for installation and first steps.
          files: |
            Gestura-windows-x64.zip
            Gestura-Setup-*.exe
